<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolvian — Career Path</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="logo" href="index.html">EVOLVIAN</a><nav><a href="index.html">Home</a><a class="active" href="learn.html">Learn</a><a href="community.html">Community</a><a href="profile.html">Profile</a></nav><a class="avatar" href="profile.html">A</a></header><main class="page"><a class="btn" href="learn.html">← Back to Learning Paths</a><section id="careerDetail" class="career-detail" style="margin-top:20px"><p class="muted">Loading career path…</p></section></main><script src="career-paths.js"></script><script>const data=window.EVOLVIAN_CAREERS||[];const id=new URLSearchParams(location.search).get('id');const c=data.find(x=>x.id===id)||data.find(x=>x.t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')===id);const el=document.getElementById('careerDetail');if(!c){el.innerHTML='<h2>Career path not found</h2><p class="muted">Choose another path from Learn.</p>'}else{el.innerHTML='<small>'+c.domain.toUpperCase()+'</small><h1>'+c.t+'</h1><p>'+c.s+'</p><div class="path-track">'+c.r.map((x,n)=>'<div class="path-step"><i>'+(n+1)+'</i><strong>'+x+'</strong><small>'+(n===0?'Start here':n===c.r.length-1?'Advanced / leadership':'Build experience')+'</small></div>').join('')+'</div><div class="path-columns"><div><h3>Core skills</h3><div class="skill-list">'+c.k.map(x=>'<span>'+x+'</span>').join('')+'</div></div><div><h3>Build evidence</h3><ul>'+c.p.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><a class="primary" href="projects.html">Find related projects →</a>'}</script></body></html>
