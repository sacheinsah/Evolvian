<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolvian — Project</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="logo" href="index.html">EVOLVIAN</a><nav><a href="index.html">Home</a><a class="active" href="learn.html">Learn</a><a href="community.html">Community</a><a href="profile.html">Profile</a></nav><a class="avatar" href="profile.html">A</a></header><main class="page"><a class="btn" href="projects.html">← Back to Projects</a><section id="view" class="panel" style="margin-top:20px"><p class="muted">Loading project…</p></section></main><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app-v2.js?v=20261003-2"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),el=document.getElementById('view');if(!id){el.innerHTML='<h2>Project not found</h2>';return}const sb=window.supabase.createClient(window.Evolvian_CONFIG.SUPABASE_URL,window.Evolvian_CONFIG.SUPABASE_PUBLISHABLE_KEY);const r=await sb.from('projects').select('*').eq('id',id).single();if(r.error){el.innerHTML='<h2>Project unavailable</h2><p class="muted">Return to Projects and try again.</p>';return}const x=r.data;el.innerHTML='<span>PROJECT</span><h1>'+esc(x.title)+'</h1><p>'+esc(x.description||'')+'</p><div class="tags"><span class="tag">'+esc(String(x.required_level||'initiate').toUpperCase())+'</span><span class="tag">'+esc(String(x.status||'open').toUpperCase())+'</span></div><br><button class="primary" id="join">Join project</button>';document.getElementById('join').onclick=async()=>{const s=await sb.auth.getSession();if(!s.data.session)return location.replace('login.html');const q=await sb.rpc('join_project',{p_project_id:id});if(q.error)toast(q.error.message,true);else toast('Joined project')}})().catch(e=>console.error(e));function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function toast(m,b){const t=document.querySelector('.toast');t.textContent=m;t.className='toast show'+(b?' bad':'');setTimeout(()=>t.className='toast',4000)}</script></body></html>
