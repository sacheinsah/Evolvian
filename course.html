<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolvian — Course</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="logo" href="index.html">EVOLVIAN</a><nav><a href="index.html">Home</a><a class="active" href="learn.html">Learn</a><a href="community.html">Community</a><a href="profile.html">Profile</a></nav><a class="avatar" href="profile.html">A</a></header><main class="page"><a class="btn" href="learn.html">← Back to Learn</a><section id="courseView" class="panel" style="margin-top:20px"><p class="muted">Loading course…</p></section></main><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app-v2.js?v=20261003-2"></script><script>(async()=>{const el=document.getElementById('courseView'),id=new URLSearchParams(location.search).get('id');if(!id){el.innerHTML='<h2>Course not found</h2>';return}const sb=window.supabase.createClient(window.Evolvian_CONFIG.SUPABASE_URL,window.Evolvian_CONFIG.SUPABASE_PUBLISHABLE_KEY);try{const c=await sb.from('courses').select('*').eq('id',id).single();if(c.error)throw c.error;const l=await sb.from('lessons').select('*').eq('course_id',id).order('position',{ascending:true});if(l.error)throw l.error;el.innerHTML='<span>COURSE</span><h1>'+escCourse(c.data.title)+'</h1><p class="muted">'+escCourse(c.data.description||'')+'</p><div class="panel"><h2>Lessons</h2>'+((l.data||[]).map(x=>'<article class="question"><h3>'+escCourse(x.title)+'</h3><p>'+escCourse(x.content||'')+'</p>'+(x.video_url?'<a class="primary" target="_blank" rel="noopener" href="'+escAttr(x.video_url)+'">Watch lesson →</a>':'')+'</article>').join('')||'<p class="muted">No lessons published yet.</p>')+'</div>'}catch(e){console.error(e);el.innerHTML='<h2>Course unavailable</h2><p class="muted">This course could not be loaded. Please return to Learn and try again.</p>'}})();function escCourse(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function escAttr(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</script></body></html>
